# Three boxes of two sizes, a load balancer in front of the two small ones,
# and the bench that sends buyers at them.
#
# Every box gets the same TICKETFLOW_CHECKOUT_SIGNING_KEY: that shared secret is
# what lets any box check a session token another box handed out. Change it here,
# once, for all of them.
x-checkout-key: &checkout-key
  TICKETFLOW_CHECKOUT_SIGNING_KEY: compose-demo-checkout-key-replace-before-real-use-42
# "cpus" is a hard limit enforced by the container runtime, so here the size of
# a box is real CPU, not just a thread count.
services:
  box-small-1:
    build: .
    image: ticketflow:lesson-7
    cpus: 1.0
    environment:
      <<: *checkout-key
      TICKETFLOW_BOX_NODE: box-small-1
      TICKETFLOW_BOX_CORES: "1"
    ports:
      - "8081:8080"

  box-small-2:
    image: ticketflow:lesson-7
    depends_on: [box-small-1]
    cpus: 1.0
    environment:
      <<: *checkout-key
      TICKETFLOW_BOX_NODE: box-small-2
      TICKETFLOW_BOX_CORES: "1"
    ports:
      - "8082:8080"

  box-big:
    image: ticketflow:lesson-7
    depends_on: [box-small-1]
    cpus: 4.0
    environment:
      <<: *checkout-key
      TICKETFLOW_BOX_NODE: box-big
      TICKETFLOW_BOX_CORES: "4"
    ports:
      - "8083:8080"

  balancer:
    image: ticketflow:lesson-7
    depends_on: [box-small-1, box-small-2]
    cpus: 1.0
    environment:
      TICKETFLOW_BOX_NODE: balancer
      TICKETFLOW_BOX_CORES: "1"
      TICKETFLOW_BALANCER_BACKENDS_0_NAME: box-small-1
      TICKETFLOW_BALANCER_BACKENDS_0_URL: http://box-small-1:8080
      TICKETFLOW_BALANCER_BACKENDS_1_NAME: box-small-2
      TICKETFLOW_BALANCER_BACKENDS_1_URL: http://box-small-2:8080
    ports:
      - "8080:8080"

  bench:
    image: ticketflow:lesson-7
    depends_on: [box-small-1, box-small-2, box-big, balancer]
    cpus: 2.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TICKETFLOW_BOX_NODE: bench
      TICKETFLOW_BOX_CORES: "1"
    ports:
      - "9090:8080"
