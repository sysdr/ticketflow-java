spring.application.name=ticketflow
server.port=8080

# Domain settings (read in TicketFlowConfig)
ticketflow.hold-ttl-seconds=120
ticketflow.venue.rows=5
ticketflow.venue.seats-per-row=10

# One line per event, request id first, so `grep rid=r-1a2b3c4d` rebuilds a whole request.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{rid:-none}] %msg%n
logging.level.ticketflow.events=INFO
