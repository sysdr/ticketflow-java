<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 8 700 340" width="700" height="340" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="800">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="12" y="8" width="700" height="340" fill="#ffffff"/>

  <!-- connections -->
  <g transform="translate(0,0)">
    <path d="M140,178 L178,178" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>
  <g transform="translate(0,0)">
    <path d="M280,178 L338,178" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>
  <g transform="translate(0,0)">
    <path d="M490,156 C525,156 525,48 558,48" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
    <path d="M490,178 L558,178" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
    <path d="M490,200 C525,200 525,308 558,308" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>
  <g transform="translate(0,0)">
    <path d="M415,222 L415,274" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>

  <!-- components -->
  <g transform="translate(24,146)">
    <rect width="116" height="64" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
    <text x="58" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">Dashboard</text>
  </g>
  <g transform="translate(180,146)">
    <rect width="100" height="64" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
    <text x="50" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">API</text>
  </g>
  <g transform="translate(340,134)">
    <rect width="150" height="88" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
    <text x="75" y="44" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#1f2937">Inventory</text>
  </g>
  <g transform="translate(560,20)">
    <rect width="140" height="56" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="28" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">Seats</text>
  </g>
  <g transform="translate(560,150)">
    <rect width="140" height="56" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="28" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">Holds</text>
  </g>
  <g transform="translate(560,280)">
    <rect width="140" height="56" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="28" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">Bookings</text>
  </g>
  <g transform="translate(340,276)">
    <rect width="150" height="56" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2" filter="url(#sh)"/>
    <text x="75" y="28" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="600" fill="#1f2937">Event log</text>
  </g>

  <!-- annotations -->
  <g transform="translate(240,96)">
    <rect width="140" height="28" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
    <text x="70" y="14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">same request id</text>
  </g>
  <g transform="translate(0,0)">
    <path d="M310,124 L310,172" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowO)" filter="url(#sh)"/>
  </g>

  <g transform="translate(555,228)">
    <rect width="150" height="28" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
    <text x="75" y="14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">lease + deadline</text>
  </g>
  <g transform="translate(0,0)">
    <path d="M630,228 L630,212" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowO)" filter="url(#sh)"/>
  </g>

  <g transform="translate(130,290)">
    <rect width="150" height="28" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
    <text x="75" y="14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">one line per step</text>
  </g>
  <g transform="translate(0,0)">
    <path d="M280,304 L336,304" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowO)" filter="url(#sh)"/>
  </g>
</svg>
