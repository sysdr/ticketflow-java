server:
  port: 8080

spring:
  application:
    name: ticketflow

# Where each process lives. The docker profile overrides only this block.
topology:
  small-1: http://localhost:8081
  small-2: http://localhost:8082
  big: http://localhost:8083
  balancer: http://localhost:8080

ticketflow:
  box:
    # The name this process stamps on bookings and log lines.
    node: box-a
    # Threads allowed to do CPU work at once. 0 = every core the JVM can see.
    cores: 0
  signing:
    # CPU milliseconds one ticket signature should cost. Calibrated at startup.
    target-millis: 8
    # Set above 0 to pin the hash rounds and skip calibration.
    rounds: 0
  budget:
    # The whole-request latency budget from lesson 4.
    total-millis: 200
  checkout:
    # signed: the buyer carries the session as a signed token, so any box can confirm (lesson 7 default).
    # server: the session lives in the memory of the box that started the checkout (the "before" picture).
    sessions: signed
    # HMAC key for signed sessions. Every box must share it; anyone who has it can mint sessions.
    # This value is for local development only. In Docker it is overridden by TICKETFLOW_CHECKOUT_SIGNING_KEY.
    signing-key: local-dev-only-checkout-key-change-me-0123456789
  balancer:
    # round-robin, least-connections or sticky. The bench switches this before each run.
    strategy: round-robin
    # How long the balancer waits for a box before answering 502.
    timeout-millis: 5000
    # No backends here: a process becomes a balancer only when it is started with some.
    # See run.sh and docker-compose.yml.
  bench:
    # How long a simulated buyer waits before giving up.
    timeout-millis: 2000
    # The most unanswered buyers the bench keeps open at once.
    max-in-flight: 3000
    # One request in this many is logged by every process it passes through.
    sample-every: 100
    # In a two-step checkout, how long a buyer takes between holding a seat and paying.
    think-millis: 1000
    presets:
      # ---- Lesson 7: two-step checkout behind round-robin ------------------
      - name: server-rr
        label: Server sessions
        group: Checkout behind round-robin
        description: Each buyer holds a seat, thinks for a second, then confirms. A steady 100 buyers a second for 10 seconds.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        checkout: server
        start-rate: 100
        end-rate: 100
        step-rate: 1
        step-seconds: 10
      - name: signed-rr
        label: Signed tokens
        group: Checkout behind round-robin
        description: Each buyer holds a seat, thinks for a second, then confirms. A steady 100 buyers a second for 10 seconds.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        checkout: signed
        start-rate: 100
        end-rate: 100
        step-rate: 1
        step-seconds: 10
      # ---- Lesson 7: the usual fix, and what a restart does to it ----------
      - name: server-sticky-restart
        label: Server sessions + sticky
        group: Sticky sessions vs. a restart
        description: Same checkout traffic. Halfway through, box-small-2 loses everything in memory, as a restart or deploy would.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: sticky
        checkout: server
        fault:
          target: ${topology.small-2}
          mode: restart
          factor: 1
        start-rate: 100
        end-rate: 100
        step-rate: 1
        step-seconds: 10
      - name: signed-rr-restart
        label: Signed tokens
        group: Sticky sessions vs. a restart
        description: Same checkout traffic. Halfway through, box-small-2 loses everything in memory, as a restart or deploy would.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        checkout: signed
        fault:
          target: ${topology.small-2}
          mode: restart
          factor: 1
        start-rate: 100
        end-rate: 100
        step-rate: 1
        step-seconds: 10
      # ---- Lesson 6: two equal boxes --------------------------------------
      - name: equal-rr
        label: Round-robin
        group: "Lesson 6: two equal boxes"
        description: Both boxes are healthy and the same size. Expect the two strategies to land close together.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        start-rate: 50
        end-rate: 400
        step-rate: 50
        step-seconds: 4
      - name: equal-lc
        label: Least-connections
        group: "Lesson 6: two equal boxes"
        description: Both boxes are healthy and the same size. Expect the two strategies to land close together.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: least-connections
        start-rate: 50
        end-rate: 400
        step-rate: 50
        step-seconds: 4
      # ---- Lesson 6: one box three times slower ----------------------------
      - name: slow-rr
        label: Round-robin
        group: "Lesson 6: one slow box"
        description: The second box needs three times the CPU per request, like a machine with a noisy neighbour.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        fault:
          target: ${topology.small-2}
          mode: slow
          factor: 3
        start-rate: 25
        end-rate: 250
        step-rate: 25
        step-seconds: 4
      - name: slow-lc
        label: Least-connections
        group: "Lesson 6: one slow box"
        description: The second box needs three times the CPU per request, like a machine with a noisy neighbour.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: least-connections
        fault:
          target: ${topology.small-2}
          mode: slow
          factor: 3
        start-rate: 25
        end-rate: 250
        step-rate: 25
        step-seconds: 4
      # ---- Lesson 6: one box refusing everything instantly -----------------
      - name: broken-rr
        label: Round-robin
        group: "Lesson 6: one box failing fast"
        description: The second box answers every booking with an instant 503. A steady 200 buyers a second for 10 seconds.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: round-robin
        fault:
          target: ${topology.small-2}
          mode: fail-fast
          factor: 1
        start-rate: 200
        end-rate: 200
        step-rate: 1
        step-seconds: 10
      - name: broken-lc
        label: Least-connections
        group: "Lesson 6: one box failing fast"
        description: The second box answers every booking with an instant 503. A steady 200 buyers a second for 10 seconds.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        balancer: ${topology.balancer}
        strategy: least-connections
        fault:
          target: ${topology.small-2}
          mode: fail-fast
          factor: 1
        start-rate: 200
        end-rate: 200
        step-rate: 1
        step-seconds: 10
      # ---- Lesson 5: no balancer, the bench talks to the boxes directly ----
      - name: one-small
        label: 1 small box
        group: "Lesson 5: scale up or out"
        description: No balancer. The bench sends buyers straight to the boxes, as in lesson 5.
        targets: ["${topology.small-1}"]
        start-rate: 50
        end-rate: 900
        step-rate: 50
        step-seconds: 4
      - name: one-big
        label: 1 big box (scale up)
        group: "Lesson 5: scale up or out"
        description: No balancer. The bench sends buyers straight to the boxes, as in lesson 5.
        targets: ["${topology.big}"]
        start-rate: 50
        end-rate: 900
        step-rate: 50
        step-seconds: 4
      - name: two-small
        label: 2 small boxes (scale out)
        group: "Lesson 5: scale up or out"
        description: No balancer. The bench sends buyers straight to the boxes, as in lesson 5.
        targets: ["${topology.small-1}", "${topology.small-2}"]
        start-rate: 50
        end-rate: 900
        step-rate: 50
        step-seconds: 4

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"
  level:
    root: WARN
    com.ticketflow: INFO
