spring:
  application:
    name: ticketflow
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASS:ticketflow}
    # HikariCP — default sizing. Lesson 9 will tune this deliberately
    # and show what breaks when maximum-pool-size is set too small.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000   # 3 s — fail fast rather than stack up waiting threads
  jpa:
    hibernate:
      # 'update' creates tables on first run and adds columns on schema changes.
      # For production, switch to 'validate' and use Flyway or Liquibase to
      # manage schema migrations explicitly. Don't do that yet — schema is still
      # evolving across Module 1.
      ddl-auto: update
    show-sql: false              # set true temporarily to confirm INSERT/UPDATE SQL
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always       # instanceId visible in health response

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","instanceId":"%X{instanceId}","logger":"%c{1}","msg":"%m"}%n'
