<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 70 696 196" width="696" height="196" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="800">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="28" y="70" width="696" height="196" fill="#ffffff"/>

  <!-- transitions -->
  <g transform="translate(0,0)">
    <path d="M182,120 L298,120" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>
  <g transform="translate(0,0)">
    <path d="M442,120 L558,120" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>
  <g transform="translate(0,0)">
    <path d="M350,153 C350,215 130,215 130,155" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
    <path d="M390,153 C390,260 90,260 90,155" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#sh)"/>
  </g>

  <!-- states -->
  <g transform="translate(40,88)">
    <rect width="140" height="64" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">AVAILABLE</text>
  </g>
  <g transform="translate(300,88)">
    <rect width="140" height="64" rx="18" fill="#ffedd5" stroke="#fdba74" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">HELD</text>
  </g>
  <g transform="translate(560,88)">
    <rect width="140" height="64" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
    <text x="70" y="32" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1f2937">BOOKED</text>
  </g>

  <!-- transition labels (triggering events) -->
  <g transform="translate(212,82)">
    <rect width="56" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="28" y="13" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">hold</text>
  </g>
  <g transform="translate(460,82)">
    <rect width="80" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="40" y="13" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">confirm</text>
  </g>
  <g transform="translate(200,186)">
    <rect width="80" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="40" y="13" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">release</text>
  </g>
  <g transform="translate(194,221)">
    <rect width="92" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="46" y="13" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">deadline</text>
  </g>

  <!-- annotations -->
  <g transform="translate(385,222)">
    <rect width="190" height="28" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
    <text x="95" y="14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">noticed on read, no timer</text>
  </g>
  <g transform="translate(0,0)">
    <path d="M383,236 L292,234" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowO)" filter="url(#sh)"/>
  </g>

  <g transform="translate(548,190)">
    <rect width="164" height="28" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
    <text x="82" y="14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1f2937">a fact, never edited</text>
  </g>
  <g transform="translate(0,0)">
    <path d="M630,190 L630,156" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowO)" filter="url(#sh)"/>
  </g>
</svg>
