spring.application.name=ticketflow

# --- The single server under test -------------------------------------------
server.port=8080
server.tomcat.threads.max=50
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# --- Workload model ----------------------------------------------------------
# Time one booking holds a thread: stands in for validation + payment + database
# round trips, which block a platform thread. Change it and re-run the stampede.
ticketflow.booking.work-ms=25
ticketflow.seats.total=500

# --- Observability lane (separate port so the dashboard never queues behind bookings)
ticketflow.observability.port=8081

# Trace every Nth request through every component (sold seats always log).
ticketflow.log.sample-every=100
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-9logger{0} rid=%X{rid:--} %msg%n

# --- Lesson 2: the venue and its holds ---------------------------------------------------
# A hold is a lease. Short enough to watch expire on the dashboard.
ticketflow.hold.ttl-seconds=30
ticketflow.venue.rows=20
ticketflow.venue.seats-per-row=25

# --- Lesson 3: the flaky link ------------------------------------------------------------
# The lab client talks to TicketFlow through this port. The proxy forwards to server.port.
ticketflow.lab.proxy-port=8082

# --- Lesson 4: the latency budget ---------------------------------------------------------
# A buyer should wait no more than total-ms. Hop slices plus the reserve must add up to it.
ticketflow.budget.total-ms=300
ticketflow.budget.wire-ms=60
ticketflow.budget.lock-ms=10
ticketflow.budget.domain-ms=15
ticketflow.budget.payment-ms=150
ticketflow.budget.render-ms=5
ticketflow.budget.reserve-ms=60
# How long the stand-in payment provider takes (blocks the calling thread).
ticketflow.payment.latency-ms=120
