services:

  # Shared PostgreSQL database — both app instances connect here.
  # The fact that two instances share one DB is the setup for Lesson 7's
  # statelessness problem: session data stored in app-1's JVM memory is
  # invisible to app-2.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # First TicketFlow instance
  app-1:
    build: .
    environment:
      - SERVER_PORT=8080
      - INSTANCE_ID=app-1          # appears in every structured log line
      - DB_URL=jdbc:postgresql://postgres:5432/ticketflow
      - DB_USER=ticketflow
      - DB_PASS=ticketflow
    depends_on:
      postgres:
        condition: service_healthy
    # Not exposed on the host — all traffic goes through NGINX

  # Second TicketFlow instance — identical config, different INSTANCE_ID
  app-2:
    build: .
    environment:
      - SERVER_PORT=8080
      - INSTANCE_ID=app-2
      - DB_URL=jdbc:postgresql://postgres:5432/ticketflow
      - DB_USER=ticketflow
      - DB_PASS=ticketflow
    depends_on:
      postgres:
        condition: service_healthy

  # NGINX load balancer — the only port exposed to the host
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
      - ./reports:/var/www/reports:ro
    ports:
      - "80:80"
    depends_on:
      - app-1
      - app-2

volumes:
  postgres_data:
