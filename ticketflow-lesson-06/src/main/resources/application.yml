spring:
  application:
    name: ticketflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASS:ticketflow}
    # HikariCP connection pool — sizing carried forward from Lesson 9 baseline
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000    # 3s — fail fast, don't stack up waiting threads
  jpa:
    hibernate:
      ddl-auto: update            # creates tables on first run; safe for dev
    show-sql: false               # set true temporarily to see query plans
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

# Actuator: expose health and info through the load balancer
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always        # instanceId visible in health response

logging:
  pattern:
    console: '{"time":"%d{ISO8601}","level":"%p","instanceId":"%X{instanceId}","logger":"%c{1}","msg":"%m"}%n'
