# NGINX load balancer for TicketFlow Lesson 6
# Two upstream blocks — one per algorithm — so a single run can compare both.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Round-robin is NGINX's default — no directive needed.
    # Requests alternate: app-1, app-2, app-1, app-2, ...
    # Blind to how busy each server is.
    upstream ticketflow_rr {
        server app-1:8080;
        server app-2:8080;

        # Passive health check: mark a server down after 3 failures in 30s.
        # NGINX Open Source only supports passive (reaction) checks, not active
        # (polling). NGINX Plus adds active health checks — relevant detail for
        # production decisions.
    }

    # Least-connections sends each new request to the instance with the fewest
    # currently open connections. Only beats round-robin when connection duration
    # varies — see the workflow diagram for the exact scenario.
    upstream ticketflow_lc {
        least_conn;
        server app-1:8080;
        server app-2:8080;
    }

    server {
        listen 80;

        # /rr/ routes through round-robin upstream
        location /rr/ {
            proxy_pass http://ticketflow_rr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Disable keepalive to get clean per-request connection counts.
            # With keepalive on, least_conn's connection counts are inflated by
            # idle but open connections — it still works but the numbers look odd.
            proxy_http_version 1.0;
            proxy_set_header Connection "";
        }

        # /lc/ routes through least-connections upstream
        location /lc/ {
            proxy_pass http://ticketflow_lc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.0;
            proxy_set_header Connection "";
        }

        # Direct health check — bypasses the upstream to see the raw instance response
        location /health {
            proxy_pass http://ticketflow_rr/actuator/health;
        }
    }
}
